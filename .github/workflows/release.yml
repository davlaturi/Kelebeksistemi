# Testleri çalıştırır, PC'de çift tıklayarak açılacak ZIP paketini hazırlar ve
# GitHub Release oluşturur. Actions sekmesinden "Run workflow" ile ya da bir
# "v*" etiketi gönderilerek çalıştırılır.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm etiketi (ör. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testler
        run: npm test

      - name: ZIP paketi
        run: |
          NAME="Kelebek-Sinav-Dagitimi-${VERSION}"
          mkdir -p "dist/$NAME"
          cp -r index.html assets vendor ornekler README.md "dist/$NAME/"
          cat > "dist/$NAME/BENI OKU.txt" <<'EOF'
          KELEBEK SINAV DAĞITIMI

          1. Bu ZIP dosyasına sağ tıklayıp "Tümünü ayıkla" deyin.
          2. Çıkan klasördeki index.html dosyasını çift tıklayın.
             Chrome, Edge ya da Firefox'ta açılır. İnternet gerekmez.
          3. Sınıf listesi PDF'lerini sürükleyip bırakın, "Kelebek dağıtımını yap"a basın.

          Denemek için "ornekler" klasöründeki PDF'leri kullanabilirsiniz (isimler hayalidir).
          Ayrıntılı bilgi: README.md
          EOF
          sed -i 's/^          //' "dist/$NAME/BENI OKU.txt"
          (cd dist && zip -qr "$NAME.zip" "$NAME")
          echo "ZIP=dist/$NAME.zip" >> "$GITHUB_ENV"
          python3 tools/tek-dosya.py "dist/Kelebek-Sinav-Dagitimi-${VERSION}-tablet.html"
          echo "ONE=dist/Kelebek-Sinav-Dagitimi-${VERSION}-tablet.html" >> "$GITHUB_ENV"

      - name: Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "$ZIP" "$ONE" \
            --target "$GITHUB_SHA" \
            --title "Kelebek Sınav Dağıtımı $VERSION" \
            --notes-file .github/RELEASE_NOTES.md
